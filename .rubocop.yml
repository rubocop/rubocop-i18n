inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-internal_affairs
  - rubocop-rake
  - rubocop-rspec
  - rubocop-performance

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable

# rubocop-i18n does not have config/default.
InternalAffairs/UndefinedConfig:
  Enabled: false

# Specs contain Ruby snippets as cop input where interpolation-looking
# sequences in single-quoted strings are intentional.
Lint/InterpolationCheck:
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Exclude:
    # Exclude the spec directory because the rspec DSL results in long blocks
    - 'spec/**/*'
